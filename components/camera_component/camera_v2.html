<div id="container" style="position:relative;width:100%">
  <video id="video" autoplay playsinline muted
         style="width:100%;display:block;border-radius:8px"></video>
  <canvas id="overlay"
          style="position:absolute;top:0;left:0;width:100%;height:100%;
                 border-radius:8px;pointer-events:none"></canvas>
</div>
<div id="guidance"
     style="padding:8px 12px;font-size:1em;background:rgba(0,0,0,0.6);
            border-radius:4px;margin:6px 0;min-height:2em;color:#66ff66">
  Initialising camera…
</div>
<div id="conf-bar" style="height:6px;background:#333;border-radius:3px;margin:4px 0 8px">
  <div id="conf-fill"
       style="height:100%;background:#4CAF50;border-radius:3px;
              width:0%;transition:width 0.4s ease"></div>
</div>
<div id="controls" style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 0">
  <button id="btn-pause"
          style="padding:10px 18px;font-size:0.95em;border:none;border-radius:8px;
                 cursor:pointer;background:#333;color:#fff;flex:1;min-width:100px">
    &#9646;&#9646; Pause
  </button>
  <button id="btn-flip"
          style="padding:10px 18px;font-size:0.95em;border:none;border-radius:8px;
                 cursor:pointer;background:#333;color:#fff;flex:1;min-width:100px">
    &#8635; Flip
  </button>
</div>
<div id="error" style="color:#ff5555;padding:12px;display:none"></div>
